services:
  # ---------------------------------------------------------------------------
  # Seed MongoDB explicitly during first-time local setup.
  #
  # This service is excluded from a normal `docker compose up`.
  # Run it manually only when the database is new or intentionally reset:
  #
  #   docker compose up -d mongodb
  #   docker compose --profile seed run --rm mongodb-seed
  #
  # For the hosted deployment, use the same container entrypoint as a
  # one-off Cloud Run Job after provisioning the external MongoDB database.
  # ---------------------------------------------------------------------------
  # 
  mongodb:
    image: mongodb/mongodb-atlas-local:8.0
    hostname: mongodb
    container_name: mim-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb
      - mongodb-mongot:/data/mongot
    restart: unless-stopped

  mongodb-seed:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_DEV: "true"
    image: mim-pipeline-inspector:local
    container_name: mim-mongodb-seed
    restart: "no"
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DATABASE: ${MONGODB_DATABASE:-mim}
    volumes:
      - ./scripts:/app/scripts:ro
      - ./data:/app/data:ro
      - ./fixtures:/app/fixtures:ro
    entrypoint:
      - python
      - /app/scripts/seed_mongodb.py
    depends_on:
      mongodb:
        condition: service_healthy


  terraform-init:
    image: hashicorp/terraform:1.14
    container_name: mim-terraform-init
    profiles: ["infra"]
    restart: "no"
    working_dir: /workspace/infra
    volumes:
      - ./infra:/workspace/infra
      - type: bind
        source: ${ADC_FILE}
        target: /tmp/gcp/application_default_credentials.json
        read_only: true
        bind:
          create_host_path: false
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp/application_default_credentials.json
      TF_VAR_project_id: ${GOOGLE_CLOUD_PROJECT}
      TF_VAR_region: ${GOOGLE_CLOUD_REGION:-australia-southeast1}
      TF_VAR_gke_zone: ${GKE_CLUSTER_LOCATION:-australia-southeast1-a}
      TF_VAR_mim_api_image: ${MIM_API_IMAGE}
    command:
      - init
      - -input=false

  terraform-apply:
    image: hashicorp/terraform:1.14
    container_name: mim-terraform-apply
    profiles: ["infra"]
    restart: "no"
    working_dir: /workspace/infra
    volumes:
      - ./infra:/workspace/infra
      - type: bind
        source: ${ADC_FILE}
        target: /tmp/gcp/application_default_credentials.json
        read_only: true
        bind:
          create_host_path: false
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp/application_default_credentials.json

      TF_VAR_project_id: ${GOOGLE_CLOUD_PROJECT:?Set GOOGLE_CLOUD_PROJECT in .env}
      TF_VAR_region: ${GOOGLE_CLOUD_REGION:-australia-southeast1}
      TF_VAR_gke_zone: ${GKE_CLUSTER_LOCATION:-australia-southeast1-a}
      TF_VAR_mim_api_image: ${MIM_API_IMAGE}
      TF_VAR_real_execution: ${REAL_EXECUTION:-false}
      TF_VAR_gke_worker_nodes: ${GKE_WORKER_NODES:-0}

    entrypoint:
      - sh
      - -lc
    command:
      - |
        terraform init -input=false
        terraform validate
        terraform plan -input=false -out=tfplan
        terraform apply -input=false -auto-approve tfplan
        
  # ---------------------------------------------------------------------------
  # Default long-running local demo stack
  # ---------------------------------------------------------------------------

  mongodb-mcp:
    image: node:20
    container_name: mim-mongodb-mcp
    working_dir: /app
    environment:
      MDB_MCP_CONNECTION_STRING: mongodb://mongodb:27017/?directConnection=true
    command:
      - sh
      - -c
      - >
        npx -y mongodb-mcp-server@latest
        --transport http
        --httpHost=0.0.0.0
        --readOnly
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('net').connect(3000, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))\""
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s


  splunk:
    image: splunk/splunk:latest
    container_name: splunk-enterprise
    environment:
      SPLUNK_GENERAL_TERMS: "--accept-sgt-current-at-splunk-com"
      SPLUNK_START_ARGS: "--accept-license"
      SPLUNK_PASSWORD: "${SPLUNK_PASSWORD:-ChangeMe123!}"
      SPLUNK_HEC_TOKEN: "${SPLUNK_HEC_TOKEN:-demo-hec-token}"
    ports:
      - "18000:8000"
      - "8088:8088"
      - "8089:8089"
    volumes:
      - splunk-etc:/opt/splunk/etc
      - splunk-var:/opt/splunk/var


  mim-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_DEV: "true"
    image: mim-pipeline-inspector:local
    container_name: mim-api
    environment:
      PYTHONPATH: /app
      CLOUDSDK_CORE_PROJECT: ${GOOGLE_CLOUD_PROJECT:-project-8ecd61cd-68ba-43c2-abd}
      GKE_CLUSTER_NAME: ${GKE_CLUSTER_NAME:-mim-demo-cluster}
      GKE_CLUSTER_LOCATION: ${GKE_CLUSTER_LOCATION:-australia-southeast1-a}
      USE_MONGO_MCP: "true"
      MONGODB_MCP_URL: http://mongodb-mcp:3000/mcp

      # Keep safe mode on for the first smoke test.
      REAL_EXECUTION: ${REAL_EXECUTION:-false}

      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-australia-southeast1}
      GOOGLE_GENAI_USE_VERTEXAI: ${GOOGLE_GENAI_USE_VERTEXAI:-True}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      SPLUNK_HEC_URL: ${SPLUNK_HEC_URL:-https://host.docker.internal:8088/services/collector}
      SPLUNK_HEC_TOKEN: ${SPLUNK_HEC_TOKEN:-}
      SPLUNK_AUDIT_INDEX: ${SPLUNK_AUDIT_INDEX:-mim_workflow_audit}
      SPLUNK_VERIFY_SSL: ${SPLUNK_VERIFY_SSL:-false}

      # Used when Application Default Credentials are mounted below.
      GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp/application_default_credentials.json
    volumes:
      - ./app:/app/app:ro
      - ./agents:/app/agents:ro
      - ./scripts:/app/scripts:ro
      - ./fixtures:/app/fixtures:ro
      - ./data:/app/data
      - ${HOME}/.config/gcloud/application_default_credentials.json:/tmp/gcp/application_default_credentials.json:ro
      - ./playbooks:/app/playbooks:ro
    entrypoint:
      - python
      - -m
      - uvicorn
    command:
      - app.api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mongodb-mcp
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/options', timeout=3)\""
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  frontend:
    image: node:20
    container_name: mim-frontend
    working_dir: /app/frontend
    environment:
      VITE_API_BASE_URL: ""
    volumes:
      - ./frontend:/app/frontend
      - mim-frontend-node-modules:/app/frontend/node_modules
    command:
      - sh
      - -c
      - npm install && npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    depends_on:
      - mim-api
      - splunk

  # ---------------------------------------------------------------------------
  # Optional ADK workflows
  # ---------------------------------------------------------------------------

  mim-agent:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_DEV: "true"
    image: mim-pipeline-inspector:local
    container_name: mim-agent
    profiles: ["agent"]
    working_dir: /app/agents
    environment:
      PYTHONPATH: /app
      MIM_API_BASE_URL: http://mim-api:8000

      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-australia-southeast1}
      GOOGLE_GENAI_USE_VERTEXAI: ${GOOGLE_GENAI_USE_VERTEXAI:-True}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp/application_default_credentials.json
    volumes:
      - ./agents:/app/agents:ro
      - ./app:/app/app:ro
      - ./fixtures:/app/fixtures:ro
      - ./data:/app/data
      - ${HOME}/.config/gcloud/application_default_credentials.json:/tmp/gcp/application_default_credentials.json:ro
    entrypoint:
      - adk
    command:
      - run
      - mim_agent
    depends_on:
      - mim-api

  mim-adk-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_DEV: "true"
    image: mim-pipeline-inspector:local
    container_name: mim-adk-web
    working_dir: /app/agents
    environment:
      PYTHONPATH: /app
      MIM_API_BASE_URL: http://mim-api:8000
      REAL_EXECUTION: ${REAL_EXECUTION:-false}

      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-australia-southeast1}
      GOOGLE_GENAI_USE_VERTEXAI: ${GOOGLE_GENAI_USE_VERTEXAI:-True}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp/application_default_credentials.json
    volumes:
      - ./agents:/app/agents:ro
      - ./app:/app/app:ro
      - ./fixtures:/app/fixtures:ro
      - ./data:/app/data
      - ${ADC_FILE}:/tmp/gcp/application_default_credentials.json:ro
    entrypoint:
      - adk
    command:
      - web
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - --allow_origins
      - "regex:https://.*\\.cloudshell\\.dev"
    ports:
      - "8001:8001"
    depends_on:
      - mim-api

  # ---------------------------------------------------------------------------
  # Existing one-shot dataset-profiling and incident-analysis workflows
  # ---------------------------------------------------------------------------

  mim-inspector:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_DEV: "true"
    image: mim-pipeline-inspector:local
    container_name: mim-pipeline-inspector
    profiles: ["inspection"]
    environment:
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-australia-southeast1}
      GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp/application_default_credentials.json
    volumes:
      - ./mim_pipeline_inspector.py:/app/mim_pipeline_inspector.py:ro
      - ./app:/app/app:ro
      - ./fixtures:/app/fixtures:ro
      - ./data:/app/data
      - ${HOME}/.config/gcloud/application_default_credentials.json:/tmp/gcp/application_default_credentials.json:ro
    command:
      - --payload
      - /app/fixtures/payloads/incoming-incident-salesforce-sso.json

  mim-inspector-local-file:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_DEV: "true"
    image: mim-pipeline-inspector:local
    container_name: mim-pipeline-inspector-local-file
    profiles: ["local-file"]
    environment:
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-australia-southeast1}
    volumes:
      - ./mim_pipeline_inspector.py:/app/mim_pipeline_inspector.py:ro
      - ./app:/app/app:ro
      - ./data:/app/data
    command:
      - --dataset-uri
      - /app/data/generated/cyber_mim_incidents.csv
      - --output-uri
      - /app/data/output/inspection.json
      - --client-size
      - enterprise
      - --target-use-case
      - known_issue_matching
      - --target-use-case
      - kba_recommendation
      - --target-use-case
      - resolver_group_classification
      - --target-use-case
      - validation_recommendation

  mim-worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_DEV: "true"
    image: mim-pipeline-inspector:local
    container_name: mim-incident-worker
    profiles: ["worker"]
    environment:
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-australia-southeast1}
    volumes:
      - ./mim_incident_worker.py:/app/mim_incident_worker.py:ro
      - ./app:/app/app:ro
      - ./fixtures:/app/fixtures:ro
      - ./data:/app/data
    entrypoint:
      - python
      - /app/mim_incident_worker.py
    command:
      - --incoming-file
      - /app/fixtures/payloads/incoming-incident-salesforce-sso.json
      - --historical-incidents
      - /app/data/generated/cyber_mim_incidents.csv
      - --resolution-db
      - /app/data/resolution_db/incident_resolution_steps.jsonl
      - --output-file
      - /app/data/output/incoming-incident-analysis.json

  # This preserves your existing internal MCP smoke workflow.
  # It is separate from the MongoDB MCP HTTP service used by FastAPI.
  mim-mcp:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_DEV: "true"
    image: mim-pipeline-inspector:local
    container_name: mim-mcp-smoke
    profiles: ["internal-mcp-smoke"]
    environment:
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-australia-southeast1}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
    volumes:
      - ./app:/app/app:ro
      - ./fixtures:/app/fixtures:ro
      - ./data:/app/data
    entrypoint:
      - python
      - -m
      - app.mcp.server

# ---------------------------------------------------------------------------
# Live queue of psuedo data
# ---------------------------------------------------------------------------

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  normalized-incident-worker:
    build: .
    command: python -m app.workers.normalized_incident_worker
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379/0
      REDIS_INCIDENT_QUEUE: normalized-incidents
      HISTORICAL_INCIDENTS_PATH: data/generated/cyber_mim_incidents.csv
    volumes:
      - ./data:/app/data

  # ---------------------------------------------------------------------------
  # End-to-end workflow smoke test
  # ---------------------------------------------------------------------------

  mim-workflow-smoke:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_DEV: "true"
    image: mim-pipeline-inspector:local
    container_name: mim-workflow-smoke
    profiles: ["smoke"]
    environment:
      PYTHONPATH: /app
      USE_MONGO_MCP: "true"
      MONGODB_MCP_URL: http://mongodb-mcp:3000/mcp
      REAL_EXECUTION: ${REAL_EXECUTION:-false}

      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-australia-southeast1}
      GOOGLE_GENAI_USE_VERTEXAI: ${GOOGLE_GENAI_USE_VERTEXAI:-True}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp/application_default_credentials.json
    volumes:
      - ./mim_workflow_smoke.py:/app/mim_workflow_smoke.py:ro
      - ./app:/app/app:ro
      - ./fixtures:/app/fixtures:ro
      - ./data:/app/data
      - ${HOME}/.config/gcloud/application_default_credentials.json:/tmp/gcp/application_default_credentials.json:ro
    entrypoint:
      - python
      - /app/mim_workflow_smoke.py
    command:
      - --payload
      - /app/fixtures/payloads/incoming-incident-salesforce-sso.json
      - --historical-incidents
      - /app/data/generated/cyber_mim_incidents.csv
      - --approve-action-id
      - uat-step-3
    depends_on:
      - mongodb-mcp

volumes:
  mim-frontend-node-modules:
  mongodb-data:
  mongodb-config:
  mongodb-mongot:
  splunk-etc:
  splunk-var:
